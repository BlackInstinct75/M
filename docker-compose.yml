version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "3000:3000" # Exponemos el puerto 3000 al exterior de forma limpia
    extra_hosts:
      - "host.docker.internal:host-gateway" # Permite al backend hablar con Windows
    restart: always

  frontend:
    build: ./frontend-web
    ports:
      - "8080:80" # Tu web estará accesible en http://localhost:8080
    depends_on:
      - backend
    restart: always